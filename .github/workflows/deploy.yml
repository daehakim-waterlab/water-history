# Build the Jupyter Book and publish it to GitHub Pages on every push to main.
# Settings → Pages → Source must be "GitHub Actions" (see README.md).
name: Deploy book

on:
  push:
    branches: [main]
  workflow_dispatch:

# The site is served from a project subpath: /water-history/
env:
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04 # pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Jupyter Book
        run: pip install -r requirements.txt
      - name: Build HTML
        run: jupyter book build --html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html
      - id: deployment
        uses: actions/deploy-pages@v4
